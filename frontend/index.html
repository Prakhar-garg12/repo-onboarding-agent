<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repo Onboarding Agent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Repo Onboarding Agent</h1>
    <p class="subtitle">Load a GitHub repository, then ask how it works. The agent explores the code and shows you everything it read.</p>

    <section class="card">
      <h2>1. Load a repository</h2>
      <div class="row">
        <input id="repo-url" type="text" placeholder="https://github.com/pallets/click">
        <button id="load-btn">Load</button>
      </div>
      <p id="repo-status" class="status"></p>
    </section>

    <section class="card">
      <h2>2. Ask a question</h2>
      <div class="row">
        <input id="question" type="text" placeholder="How does argument parsing work?" disabled>
        <button id="ask-btn" disabled>Ask</button>
      </div>
      <p id="ask-status" class="status"></p>
    </section>

    <section class="card" id="result-section" hidden>
      <h2>Answer</h2>
      <p id="answered-question" class="question"></p>
      <div id="answer" class="markdown"></div>
    </section>

    <section class="card" id="findings-section" hidden>
      <h2>What the agent read</h2>
      <p class="hint">Click a step to see the exact text the agent saw. Use this to check the answer.</p>
      <ol id="findings"></ol>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
